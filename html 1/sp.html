<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>position of property in css</title>
    <style>
        .outer{
        height: 600px;
        width:1000px;
        border:5px solid lightsalmon;
        margin:auto
        }
        .head{
            height: 80px;
            width: 100%;
            background-color: brown;
            position: fixed;
        }
         .head2 {
        height:80px;
        width:100%;
        background-color: black;
        position: sticky;
        top: 80px;
        }
        .row{
            height: 250px;
            width: 100%;
            background-color: antiquewhite;
        }
        .box{
            height: 250px;
            width:250px;
            margin: auto;
            background-color: blue;
            position: absolute;
        }
        .box1{
            height: 250px;
            width: 250px;
            margin: auto;
            background-color: black;
            position: relative;
        }
        .row2{
            background-color: yellow;
        }
    </style>
</head>
<body>
 <div class="outer">
    <header class="head"></header>
    <header class="head2"></header>
    <div class="row">
    <div class="box"></div>
    </div>
    <div class="row row2">
    <div class="box1"></div>
    </div>
 </div>
 
</body>
</html>
