<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: grid;
            grid-template-columns: auto auto auto;
            background-color: dodgerblue;
            column-gap: 50px;
            row-gap: 10px;
            padding-left: 10px;
        }
        .container >div{
            background-color: white;
            border: 1px solid black;
            padding: 20px;
            font-size: 30px;
            text-align: center;
            
        }
    </style>
</head>
<body>
   <div class="container">
    <div class="">1</div>
    <div class="">2</div>
    <div class="">3</div>
    <div class="">4</div>
    <div class="">5</div>
    <div class="">6</div>
    <div class="">7</div>
    <div class="">8</div>
   </div> 
</body>
</html>
