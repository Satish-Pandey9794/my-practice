<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>satish pandey</title>
    <style>
        #heart{
            position: relative;
            width: 200px;
            height: 180px;
            background-color: transparent;
            margin: 100px auto;
        }
        #heart::before,
        #heart::after{   
         position: absolute;
         content:  "";
         width: 50px;
         height: 80px;
         background-color: red;
         border-radius: 100px 100px 0px 0px;
         transform: rotate(-45deg);
         transform-origin: 0 100%;
         left:50px;
         top:0px;

        }
        #heart::after{
            left: 0;
            
            transform: rotate(45deg);
            transform-origin: 100% 100%;
        }
    </style>
</head>
<body>
    <div id="heart"></div>
</body>
</html>
