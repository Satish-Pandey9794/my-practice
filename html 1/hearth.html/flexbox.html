<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .outer {
            height: 600px;
            width: 1200px;
            background-color: cyan;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            flex-direction: row-reverse;

        }

        .box {
            height: 200px;
            width: 200px;
            background-color: tomato;
            border: 1px solid black;
            color: white;
            font-size: 45px;
            display: flex;
            align-items: center;
            justify-content: center;


        }
    </style>
</head>

<body>
    <div class="outer">
        <div class="box">A</div>
        <div class="box">B</div>
        <div class="box">C</div>
        <div class="box">D</div>
        <div class="box">E</div>
        <div class="box">F</div>
        <div class="box">G</div>



    </div>
</body>

</html>
