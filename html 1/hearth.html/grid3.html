<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .grid-container {
            display: grid;
            grid-template-rows: 80px 200px;
            gap: 10px;
            background-color: aqua;
            padding: 10px;
            grid-template-columns: auto auto auto;

        }

        .grid-container>div {
            background-color: aliceblue;
            color: #000;
            padding: 10px;
            text-align: center;
            font-size: 30px;
            display: grid;
            align-items: center;
        }
    </style>
</head>

<body>
    <div class="grid-container">
        <div class="">1</div>
        <div class="">2</div>
        <div class="">3</div>
        <div class="">4</div>
        <div class="">5</div>
        <div class="">6</div>
        <div class="">7</div>
        <div class="">8</div>
    </div>
</body>

</html>
