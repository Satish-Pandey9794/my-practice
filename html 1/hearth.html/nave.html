<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #252825;
        }

        ul {
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        ul li {
            list-style: none;
            position: relative;
        }

        ul li a {
            text-decoration: none;
            font-size: 4em;
            letter-spacing: 2px;
            text-transform: uppercase;
            line-height: 1em;
            color: transparent;
            -webkit-text-stroke: 1px rgba(255,255,255,0.5);
        }
        ul li a::before{
            content: attr(data-text);
            position: absolute;
            color: var(--clr);
            width: 0px;
            transition: 1s;
            border-right: 8px solid var(--clr);
            -webkit-text-stroke: 1px var(--clr);
        }
        ul li a:hover::before{
            width: 100%;
            filter: drop-shadow(0 0 25px var(--clr));
        }
    </style>
</head>

<body>
    <ul type="circle">
        <li style="--clr:#00ade1"><a href="#" data-text="&nbsp; Home">Home</a></li>
        <li style="--clr:#ff6492"><a href="#" data-text="&nbsp; About">About</a></li>
        <li style="--clr:#ffdd1c"><a href="#" data-text="&nbsp; services">Services</a></li>
        <li style="--clr:#00dc82"><a href="#" data-text="&nbsp; contect">Contect</a></li>
        <li style="--clr:#dc00d4"><a href="#" data-text="&nbsp; Blog">Blog</a></li>
    </ul>

</body>

</html>
