<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: grid;
            grid-template-areas: 'header header header header header header'
            'menu main main main main right''menu footer footer footer footer footer';
            gap: 10px;
            background-color: rgb(241, 63, 92);
            padding: 10px;
        }
        .container>div{
            background-color: rgb(171, 222, 171);
            padding: 10px;
            font-size: 30px;
            text-align: center;
        }
        .div1{
            grid-area: header;
            height: 90px;
        }
        .div2{
            grid-area: menu;
            height: 400px;
        }
        .div3{
            grid-area: main;
            height: 300px;
        }
         .div4{
            grid-area: right;
            height: 300px;
        }
         .div5{
            grid-area: footer;
        }
    </style>
</head>
<body>
       <div class="container">
        <div class="div1">header</div>
        <div class="div2">menu</div>
        <div class="div3">main</div>
        <div class="div4">right</div>
        <div class="div5">footer</div>   
</body>
</html>
