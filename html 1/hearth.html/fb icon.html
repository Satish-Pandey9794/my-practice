<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .fb{
            background-color: blue;
            width: 100px;
            height: 110px;
    
            margin: 200px auto;
            position: relative;
            border-radius: 5px;
            border: 15px solid blue;
            border-bottom: 0px;
            text-indent: -999em;
             overflow: hidden;
        }
        .fb::before{
            content: "/20";
            position: absolute;
            background-color: blue;
            width: 40px;
            height: 90px;
            bottom: -30px;
            right: -37px;
            border: 20px solid #eee;
            border-radius: 25px;

        }
        .fb::after{
           content: "/20";
           position: absolute;
           width: 55px;
           height: 20px;
           background-color: #eee;
           right: 5px;
           top: 50px;

        }
        
        
    </style>
</head>
<body>
    
    <div class="fb"></div>
</body>
</html>
