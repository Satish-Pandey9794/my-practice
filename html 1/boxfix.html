<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .outer{
            height: 500px;
            width: 600px;
            background-color: beige;
            margin: auto;
          border: 1px solid black;

        }

        .row
        {
            height: 200px;
            width: 100%;
            
        }
         .row2
        {
            height: 100px;
            width: 100%;
         
            
        }
        .box{
            height: 100%;
            width: 200px;
            border: 1px solid rgb(20, 22, 20);
            float: left; 
           
        }
         .box2{
            height: 100%;
            width: 200px;
            border: 1px solid rgb(27, 32, 27);
            float: left; 
            float: right;
           
           
        }
       
    </style>
    </head>
<body>
    <div class="outer">
        <div class="row">
            <div class="box" style="background-color: blue;"></div>
            <div class="box2" style="background-color: chartreuse;"></div>
        </div>
        <div class="row2"> 
            
        </div>
        <div class="row">
            <div class="box" style="background-color: darkgoldenrod;"></div>
            <div class="box2" style="background-color: darkgrey;"></div>
        </div>
    </div>
</body>
</html>
