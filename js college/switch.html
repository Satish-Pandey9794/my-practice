<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>switch light</title>
</head>
<body style="background-color: blueviolet;">

    <button onclick="document.getElementById('myImage').src='b1.png'" style="background-color: green;">Light On</button>
    <img id="myImage" src="b1.png" style="width: 100px;" >
    <button onclick="document.getElementById('myImage').src='b2.png'" style="background-color: red;">Light Off</button>
    
</body>
</html>
