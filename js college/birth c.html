<body style="background-color: aqua;">
    <div class="wrapper">
        <input type="date">
        <p> you are <span id="age"></span> year old.</p>

    </div>
    <script>
        const inputDate = document.querySelector('input');
        const age = document.getElementById('age');

        inputDate.addEventListener('change',(e) => {
            age.innerText = new Date().getFullYear()-new Date(e.target.value).getFullYear();
        }
    )
            alert ("thanks for giving me your date of birth");

    </script>
</body>
