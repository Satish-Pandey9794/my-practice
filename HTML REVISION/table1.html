<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <table border="1px" cellspacing="2" cellpadding="8" align="center" width="500px" style="background-color: rgb(171, 251, 251);">
        <tr>
            <th colspan="2" style="background-color: rgb(232, 251, 124)" ><h1>Student Login form</h1></th>
        </tr>
        <tr>
            <td>Student No:</td>
            <td><input type="text" name="sno"></td>
        </tr>
        <tr>
            <td>Name :</td>
            <td><input type="text" name="name"></td>
        </tr>
        <tr>
                    <td>Gender :</td>
            <td><input type="radio" name="gen" >Male</input>
            &nbsp
            <input type="radio" name="gen" >Female</input></td>
        </tr>
        <tr>
            <td>Password</td>
            <td><input type="password"></td>
        </tr>
        <tr>
            <td>Batch</td>
            <td><input type="text" placeholder="Enter Your Batch"></td>

        </tr>
        <tr>
            <td>Email</td>
            <td><input type="Email" placeholder="Enter Your Email"></td>
        </tr>
        <tr>
            <td>Institute Name</td>
            <td><input type="text" placeholder="Enter Your College name"></td>
        </tr>
        <tr>
            <td>Address</td>
            <td><textarea name="Address" id="#"></textarea></td>
        </tr>
        <tr>
            <td><button type="button" id="#" style="background-color: green;">Submit</button></td>
        </tr>


    </table>
</body>

</html>
